<html lang="en" data-theme="mint">

		<meta name="robots" content="noindex" />
		<script>
			(function () {
				var host = location.hostname;
				if (
					location.protocol === "http:" &&
					host !== "localhost" &&
					host !== "127.0.0.1" &&
					host !== "[::1]"
				) {
					location.replace(location.href.replace(/^http:/, "https:"));
				}
			})();
		</script>

						<p class="side-tabs__label">Tabs</p>

					<div class="side-tabs" id="side-tab-list"></div>

						<svg class="lucide" viewBox="0 0 24 24" aria-hidden="true">
							<path d="M5 12h14" />
							<path d="M12 5v14" />
						</svg>
						<span>New tab</span>
					</button>
				</aside>

				<div class="pane__main">
				<div class="tabstrip">
					<div class="tabstrip__list" id="tab-list"></div>
					<button
						type="button"
						class="tabstrip__new"
						id="tab-new"
						title="New tab"
						aria-label="New tab"

						<svg class="lucide" viewBox="0 0 24 24" aria-hidden="true">
							<path d="M5 12h14" />
							<path d="M12 5v14" />
						</svg>
					</button>
				</div>

				<header class="proxy-header" id="sj-header">
					<form id="sj-form" class="address-bar">
						<button type="button" id="sj-back" title="Back" aria-label="Back">
							<svg class="lucide" viewBox="0 0 24 24" aria-hidden="true">
								<path d="M19 12H5" />
								<path d="m12 19-7-7 7-7" />
							</svg>
						</button>
						<button
							type="button"
							id="sj-forward"
							title="Forward"
							aria-label="Forward"
						>
							<svg class="lucide" viewBox="0 0 24 24" aria-hidden="true">
								<path d="M5 12h14" />
								<path d="m12 5 7 7-7 7" />
							</svg>
						</button>
						<button type="button" id="sj-reload" title="Reload" aria-label="Reload">
							<svg class="lucide" viewBox="0 0 24 24" aria-hidden="true">
								<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />

								<path d="M8 16H3v5" />
							</svg>
						</button>
						<div class="address-field">
							<svg
								class="lucide address-field__icon"
								viewBox="0 0 24 24"
								aria-hidden="true"
							>
								<circle cx="11" cy="11" r="8" />
								<path d="m21 21-4.3-4.3" />
							</svg>
							<input
								id="sj-address"
								class="address-input"
								type="text"
								spellcheck="false"
								autocomplete="off"
								placeholder="Search or enter a URL"
								role="combobox"
								aria-expanded="false"
								aria-controls="sj-suggestions"
							/>
							<ul id="sj-suggestions" class="suggest-list" role="listbox" hidden></ul>
						</div>
						<button
							type="button"
							id="sj-split"
							title="Split screen"
							aria-label="Split screen"
							aria-pressed="false"
						>
							<svg class="lucide" viewBox="0 0 24 24" aria-hidden="true">
								<rect width="18" height="18" x="3" y="3" rx="2" />

							</svg>
						</button>
					</form>
				</header>

				<div id="sj-frame-wrapper">

							<span class="newtab__logo" id="newtab-logo"></span>
							<p class="newtab__tagline">Search the web, or paste a link</p>

						<div class="newtab__searchwrap">

									role="listbox"
